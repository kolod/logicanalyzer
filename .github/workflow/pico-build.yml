name: Build Pico Firmware v2

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Pico project (LogicAnalyzer_V2)
        uses: kolod/action-pico-build@v2.2.0
        with:
          # Adjust this if you want to build a different firmware variant
          source-dir: ${{ github.workspace }}/Firmware/LogicAnalyzer_V2
          build-dir: build
          cmake-args: |
            -DCMAKE_BUILD_TYPE=Release

